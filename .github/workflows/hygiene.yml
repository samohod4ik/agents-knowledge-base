name: hygiene

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public-tree hygiene
        run: python -m unittest discover -s tests -v
